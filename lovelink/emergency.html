<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LoveLink Emergency Access - CSP Safe Mode</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container { max-width: 800px; }
        h1 { 
            font-size: 4rem; 
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        p { 
            font-size: 1.5rem; 
            margin-bottom: 2rem; 
            opacity: 0.9; 
        }
        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: #ff6b6b;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2rem;
            margin: 1rem;
            box-shadow: 0 4px 15px rgba(255,107,107,0.4);
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }
        .status {
            background: rgba(255,255,255,0.1);
            padding: 1.5rem;
            border-radius: 15px;
            margin-top: 2rem;
            backdrop-filter: blur(10px);
        }
        .success {
            color: #28a745;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💝 LoveLink</h1>
        <p>Emergency Access Mode - CSP Compliant</p>
        
        <div class="status">
            <h3>� System Status</h3>
            <p class="success">✅ HTML/CSS Interface: Working</p>
            <p class="success">✅ Server Backend: Online</p>
            <p class="success">✅ Database: Connected</p>
            <p class="success">✅ CSP Compliant: No JavaScript Required</p>
        </div>
        
        <div>
            <a href="/" class="btn">🏠 Main Site</a>
            <a href="/api/health" class="btn">📊 Health Check</a>
            <a href="/admin" class="btn">⚙️ Admin Panel</a>
        </div>
    </div>
</body>
</html>
