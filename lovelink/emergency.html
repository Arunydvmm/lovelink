<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LoveLink - Create Beautiful Love Stories</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container { max-width: 800px; }
        h1 { 
            font-size: 4rem; 
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        p { 
            font-size: 1.5rem; 
            margin-bottom: 2rem; 
            opacity: 0.9; 
        }
        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: #ff6b6b;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2rem;
            margin: 1rem;
            box-shadow: 0 4px 15px rgba(255,107,107,0.4);
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }
        .status {
            background: rgba(255,255,255,0.1);
            padding: 1.5rem;
            border-radius: 15px;
            margin-top: 2rem;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💝 LoveLink</h1>
        <p>Create beautiful, interactive digital love stories</p>
        
        <a href="#" onclick="testApp()" class="btn">🚀 Test Application</a>
        <a href="/api/health" class="btn">📊 Check Health</a>
        
        <div class="status" id="status">
            <h3>🔍 System Status</h3>
            <p>Testing application components...</p>
            <div id="test-results"></div>
        </div>
    </div>

    <script>
        function testApp() {
            const results = document.getElementById('test-results');
            results.innerHTML = '<p>🔄 Running diagnostics...</p>';
            
            // Test 1: Basic JavaScript
            try {
                results.innerHTML += '<p>✅ JavaScript: Working</p>';
                
                // Test 2: Fetch API
                fetch('/api/health')
                    .then(response => response.json())
                    .then(data => {
                        results.innerHTML += '<p>✅ API: Connected</p>';
                        results.innerHTML += `<p>📊 Database: ${data.database?.templateCount || 0} templates</p>`;
                        results.innerHTML += '<p style="color: #90EE90; font-weight: bold;">🎉 All systems operational!</p>';
                    })
                    .catch(error => {
                        results.innerHTML += '<p>❌ API: Failed - ' + error.message + '</p>';
                    });
                    
            } catch(e) {
                results.innerHTML += '<p>❌ JavaScript: Failed - ' + e.message + '</p>';
            }
        }
        
        // Auto-run test on load
        setTimeout(testApp, 1000);
    </script>
</body>
</html>
